[package]
name = "confidential-disk-encryption"
version = "0.1.0"
edition = "2021"
description = "A cross-platform Azure VM extension for confidential disk encryption"
authors = ["Azure"]
license = "MIT"
repository = "https://github.com/Azure/confidential-linux-disk-encryption"
keywords = ["azure", "encryption", "disk", "confidential-computing"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
sysinfo = "0.37"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "std", "env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3.15"
mockall = "0.13"
rstest = "0.24"
assert_cmd = "2.0"
predicates = "3.1"

[lib]
name = "confidential_disk_encryption"
path = "src/lib.rs"

[[bin]]
name = "cde"
path = "src/main.rs"
